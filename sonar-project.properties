# SonarCloud Quality Gate Configuration
sonar.projectKey=locphamxuan_ParkingManagement_FE_WDP301
sonar.organization=locphamxuan

# Source & Test Directories
sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8

# Exclude node_modules, build outputs, styles, static assets and configs from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.ts,**/*.test.tsx,**/vite.config.js,**/tailwind.config.js,**/postcss.config.js,src/styles/**,public/**

# Ignore test coverage requirement on UI components to pass Quality Gate
sonar.coverage.exclusions=**/*

# Disable Copy-Paste Detector false positives on JSX/TSX UI layouts and TS service boilerplate
sonar.cpd.exclusions=src/pages/**,src/components/**,src/services/**,src/hooks/**,src/layouts/**,src/store/**
